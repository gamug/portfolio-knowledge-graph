repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(mkdocs\.yml|{{cookiecutter.repo_name}}/mkdocs\.yml)$
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=100000] # 100MB

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.2
    hooks:
      # Run the linter
      - id: ruff-check
        args:
          - --fix
          - --config
          - .code_quality/ruff.toml # Run the formatter.
      - id: ruff-format
        args:
          - --config
          - .code_quality/ruff.toml

  # Run mypy in the project venv (via uv) rather than mirrors-mypy's isolated
  # env: type-checking src/etl/queries.py needs the installed `portfolio_common`
  # package (with its py.typed marker) to resolve `portfolio_common.db.Database`'s
  # real return types, which an isolated env doesn't have -- same fix already
  # applied in portfolio-data-mining/portfolio-financial-analysis/portfolio-nlp
  # for the same reason. pass_filenames is off because mypy needs the whole
  # import graph, not just the changed files.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=.code_quality/mypy.ini
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
