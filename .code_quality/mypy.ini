[mypy]
mypy_path = src
show_error_codes = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_untyped_calls = True
check_untyped_defs = True
ignore_missing_imports = True
# cli/build_data_ttl.py bootstraps `src/` onto sys.path at runtime, so without
# this mypy can't resolve the local `etl` package from that entrypoint and
# silently treats the import as Any. Also needed now that the mypy
# pre-commit hook runs with pass_filenames: false (see .pre-commit-config.yaml)
# and so has no file arguments of its own to check -- mirrors the same
# `files = src, apps, cli` fix in portfolio-nlp's/portfolio-data-mining's
# mypy.ini.
files = src, cli
