[project]
name = "portfolio-kowledge-graph"
version = "0.1.0"
description = "Design/artifact repo for a knowledge-graph-backed S&P 500 portfolio system: RDF/OWL/SHACL ontology + architecture docs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "python-dotenv>=1.0",
    "pre-commit>=4.6.2",
    # --- shared DB access: portfolio_common.news_export.connect_readonly /
    # fetch_processed_articles, used by src/etl/news_to_rdf.py -- the read-only
    # two-tier SOURCE/RESULTS connect and the articles/sentiment/category join
    # for the news-NLP results store, shared with portfolio-nlp (which writes
    # that schema and delegates its own copy of the same query to this module
    # too). As of portfolio-common v1.0.0 this package is otherwise
    # DB-engine-only (portfolio_common.db.Database/Allowlist/in_clause); v1.1.0
    # added news_export as the one deliberate exception -- this repo used to
    # carry a local copy of the query instead (see
    # docs/portfolio-common-v1-migration-plan.md for that decision record).
    # v1.2.0 makes the engine swappable in one place: news_to_rdf.py annotates
    # rows with portfolio_common.db.Row (not sqlite3.Row) and names no engine.
    # Pinned by tag in [tool.uv.sources] -- bump the tag there to adopt a new
    # engine/news_export contract.
    "portfolio-common",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "commitizen>=4.17",
]

[tool.uv]
# This repo is mostly an ontology plus Markdown docs (see CLAUDE.md "Validating
# the schema"), but src/etl/ is a real importable package (the KG-population
# ETL, run via cli/build_data_ttl.py) -- package = false because it's still not
# built/installed as a wheel; src/ is put on sys.path by that entrypoint script
# instead (see cli/build_data_ttl.py).
package = false

[tool.uv.sources]
# portfolio-common lives in its own repo (github.com/gamug/portfolio-common) and
# is pinned by tag -- bump the tag here to adopt a new schema/DB contract. For
# local work against a checkout next to this repo, override with an editable
# path source:
#   portfolio-common = { path = "../portfolio-common", editable = true }
portfolio-common = { git = "https://github.com/gamug/portfolio-common", tag = "v1.2.0" }

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true
